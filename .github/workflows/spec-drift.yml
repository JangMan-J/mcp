name: Spec drift

# The library pins the MCP 2026-07-28 schema and tracks the draft spec prose.
# This job fails and opens an issue when upstream moves.

on:
  schedule:
    - cron: "23 5 * * *" # daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - id: check
        run: node scripts/check-spec-drift.mjs 2>&1 | tee drift-report.txt
      - name: Open or update a drift issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create spec-drift --description "Upstream MCP spec moved" --color BFD4F2 --force
          existing=$(gh issue list --label spec-drift --state open --json number --jq '.[0].number' || true)
          body=$(cat drift-report.txt)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Drift still present ($(date -u +%F)):"$'\n\n```'"$body"$'\n```'
          else
            gh issue create --label spec-drift --title "MCP 2026-07-28 spec drift detected" \
              --body "The daily drift watcher found upstream changes. Sync the vendored schema and re-run \`node scripts/check-spec-drift.mjs --update\`."$'\n\n```'"$body"$'\n```'
          fi
